<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

/* =========================================================
   1) SUPABASE SETUP
   ========================================================= */
const SUPABASE_URL = "https://lxsmbxdtvdjrpqgbadpt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_EX4OWbVh1dvem_WMPovA2Q_mVGCZ2Kd";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ===================== Helpers ===================== */
const CATEGORIES = ["CPU","GPU","Motherboard","RAM","Storage","PSU","Case","Cooling","Peripherals","Cables/Other"];
const EXPENSE_CATEGORIES = ["Rent","Tools/Equipment","Shipping","Software","Marketing","Utilities","Fees","Other"];
const SUPPLIERS = ["Facebook","Yaga","Bobshop","Syntech","Carbonite","Other"];
const ACCENTS = ["amber","blue","green"];
function hashAccent(str){ let h=0; for(const c of String(str)) h=(h+c.charCodeAt(0))%ACCENTS.length; return ACCENTS[h]; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtR(n){ const v=Number(n||0); return "R "+v.toLocaleString("en-ZA",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(d){ if(!d) return "—"; const dt=new Date(d); if(isNaN(dt)) return d; return dt.toLocaleDateString("en-ZA",{day:"2-digit",month:"short",year:"numeric"}); }

function resizeImageFile(file, maxDim=480, quality=0.7){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h){ if(w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } }
        else { if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; } }
        const canvas=document.createElement("canvas");
        canvas.width=w; canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg",quality));
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

function getMonthBounds(monthOffset){
  const now=new Date();
  const d=new Date(now.getFullYear(), now.getMonth()+monthOffset, 1);
  const start=new Date(d.getFullYear(), d.getMonth(), 1);
  const end=new Date(d.getFullYear(), d.getMonth()+1, 1);
  const label=d.toLocaleDateString("en-ZA",{month:"long",year:"numeric"});
  return { start, end, label };
}
function sumInRange(sales, expenses, start, end){
  const inRange = (dateStr)=>{ const dt=new Date(dateStr); return dt>=start && dt<end; };
  const periodSales = sales.filter(s=>inRange(s.date));
  const revenue = periodSales.reduce((s,x)=>s+x.total,0);
  const cost = periodSales.reduce((s,x)=>s+x.cost,0);
  const periodExpenses = expenses.filter(e=>inRange(e.date)).reduce((s,e)=>s+Number(e.amount),0);
  const profit = revenue-cost-periodExpenses;
  return { revenue, cost, expenses:periodExpenses, profit };
}

/* ===================== Minimal icon set (no external deps) ===================== */
function Icon({ name, size=16, color="currentColor" }){
  const common = { width:size, height:size, viewBox:"0 0 24 24", fill:"none", stroke:color, strokeWidth:"2", strokeLinecap:"round", strokeLinejoin:"round" };
  switch(name){
    case "dashboard": return <svg {...common}><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>;
    case "package": return <svg {...common}><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>;
    case "wrench": return <svg {...common}><path d="M14.7 6.3a4 4 0 0 1-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 1 5.4-5.4l-3-3z"/></svg>;
    case "cart": return <svg {...common}><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>;
    case "receipt": return <svg {...common}><path d="M4 3h16v18l-3-2-3 2-3-2-3 2-3-2-1 2z"/><path d="M8 8h8M8 12h8"/></svg>;
    case "plus": return <svg {...common}><path d="M12 5v14M5 12h14"/></svg>;
    case "x": return <svg {...common}><path d="M18 6L6 18M6 6l12 12"/></svg>;
    case "trash": return <svg {...common}><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>;
    case "pencil": return <svg {...common}><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>;
    case "alert": return <svg {...common}><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>;
    case "trend": return <svg {...common}><path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/></svg>;
    case "flame": return <svg {...common} fill={color} stroke="none"><path d="M12 2c1 4-4 5-4 9a4 4 0 0 0 8 0c0-1.5-1-2-1-3.5C17 9 19 11 19 14a7 7 0 0 1-14 0c0-5 4-6 5-9 .3-1 .5-2 2-3z"/></svg>;
    case "chevronDown": return <svg {...common}><path d="M6 9l6 6 6-6"/></svg>;
    case "chevronRight": return <svg {...common}><path d="M9 18l6-6-6-6"/></svg>;
    case "search": return <svg {...common}><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>;
    case "check": return <svg {...common}><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg>;
    case "arrowUp": return <svg {...common}><path d="M7 17L17 7M7 7h10v10"/></svg>;
    case "arrowDown": return <svg {...common}><path d="M7 7l10 10M17 7v10H7"/></svg>;
    case "camera": return <svg {...common}><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>;
    case "boxes": return <svg {...common}><path d="M12 2l4 2.4v4.8L12 11.6 8 9.2V4.4z"/><path d="M4 13l4 2.4v4.8L4 22l-4-2.4v-4.8z" transform="translate(2,0)"/><path d="M16 13l4 2.4v4.8L16 22l-4-2.4v-4.8z" transform="translate(2,0)"/></svg>;
    default: return null;
  }
}

/* ===================== Small building blocks ===================== */
function StatCard({label,value,sub,accent,glow}){
  const colorVar = accent==="ember"?"var(--ember)":accent==="green"?"var(--green)":accent==="blue"?"var(--blue)":"var(--amber)";
  return (
    <div className="pf-statcard" style={{"--accent":colorVar}}>
      <div className="pf-statcard-label">{label}</div>
      <div className="pf-statcard-value" style={{color:colorVar, textShadow: glow ? `0 0 12px ${colorVar}55` : "none"}}>{value}</div>
      {sub && <div className="pf-statcard-sub">{sub}</div>}
    </div>
  );
}
function Badge({tone="dim",children}){ return <span className={`pf-badge pf-badge-${tone}`}>{children}</span>; }
function EmptyState({icon,title,message}){
  return <div className="pf-empty"><Icon name={icon} size={30} color="var(--text-faint)"/><div className="pf-empty-title">{title}</div><div className="pf-empty-msg">{message}</div></div>;
}
function Field({label,children}){ return <div className="pf-field"><label>{label}</label>{children}</div>; }
function Thumb({src}){
  return src ? <img className="pf-thumb" src={src} alt="" /> : <div className="pf-thumb-placeholder"><Icon name="camera" size={16} color="var(--text-faint)"/></div>;
}

/* ===================== Auth screen ===================== */
function AuthScreen(){
  const [mode,setMode] = useState("signin");
  const [email,setEmail] = useState("");
  const [password,setPassword] = useState("");
  const [error,setError] = useState("");
  const [notice,setNotice] = useState("");
  const [busy,setBusy] = useState(false);

  async function submit(e){
    e.preventDefault();
    setError(""); setNotice(""); setBusy(true);
    try{
      if(mode==="signin"){
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if(error) throw error;
      } else {
        const { data, error } = await sb.auth.signUp({ email, password });
        if(error) throw error;
        if(data.user && !data.session){
          setNotice("Account created. Check your email to confirm it, then sign in.");
        }
      }
    }catch(err){
      setError(err.message);
    }
    setBusy(false);
  }

  return (
    <div className="pf-root">
      <div className="pf-authwrap">
        <div className="pf-authcard">
          <div style={{display:"flex",alignItems:"center",gap:8,justifyContent:"center",marginBottom:6}}>
            <Icon name="flame" size={26} color="var(--amber)"/>
            <div style={{fontFamily:"Oswald,sans-serif",fontWeight:700,fontSize:24,letterSpacing:2}}>PCFORGE</div>
          </div>
          <div style={{textAlign:"center",fontFamily:"JetBrains Mono,monospace",fontSize:10,letterSpacing:2,color:"var(--text-faint)",textTransform:"uppercase",marginBottom:26}}>Parts · Builds · Profit</div>
          <form onSubmit={submit}>
            {error && <div className="pf-error">{error}</div>}
            {notice && <div className="pf-error" style={{color:"var(--green)"}}>{notice}</div>}
            <Field label="Email"><input type="email" required value={email} onChange={e=>setEmail(e.target.value)} /></Field>
            <Field label="Password"><input type="password" required minLength={6} value={password} onChange={e=>setPassword(e.target.value)} /></Field>
            <button className="pf-btn pf-btn-primary pf-btn-block" disabled={busy} type="submit">
              {busy ? "Please wait…" : mode==="signin" ? "Sign In" : "Create Account"}
            </button>
          </form>
          <div className="pf-authtoggle" onClick={()=>{setMode(mode==="signin"?"signup":"signin"); setError(""); setNotice("");}}>
            {mode==="signin" ? <>New here? <b>Create an account</b></> : <>Already have an account? <b>Sign in</b></>}
          </div>
          <div className="pf-authnote">If sign up doesn't log you in immediately, your Supabase project has email confirmation on — check your inbox, or turn it off under Authentication → Sign In / Providers → Email in the Supabase dashboard.</div>
        </div>
      </div>
    </div>
  );
}

/* ===================== Main App ===================== */
function PcForgeApp({ user }){
  const [tab,setTab] = useState("dashboard");
  const [loading,setLoading] = useState(true);
  const [store,setStore] = useState({ parts:[], builds:[], sales:[], expenses:[] });
  const storeRef = useRef(store);
  storeRef.current = store;
  const writeQueueRef = useRef(Promise.resolve());
  const [modal,setModal] = useState(null);
  const [form,setForm] = useState({});
  const [formError,setFormError] = useState("");
  const [search,setSearch] = useState("");
  const [stockFilter,setStockFilter] = useState("all"); // all | in | out
  const [categoryFilter,setCategoryFilter] = useState("all"); // all | CPU | GPU | ...
  const [confirmKey,setConfirmKey] = useState(null);
  const [expandedPart,setExpandedPart] = useState(null);

  useEffect(()=>{
    (async ()=>{
      const { data, error } = await sb.from("pcforge_data").select("*").eq("user_id", user.id).maybeSingle();
      if(error) console.error(error);
      if(data){
        const loaded = { parts:data.parts||[], builds:data.builds||[], sales:data.sales||[], expenses:data.expenses||[] };
        storeRef.current = loaded;
        setStore(loaded);
      } else {
        const initial = { user_id:user.id, parts:[], builds:[], sales:[], expenses:[] };
        await sb.from("pcforge_data").upsert(initial, { onConflict:"user_id" });
      }
      setLoading(false);
    })();
  }, [user.id]);

  function persist(changes){
    const updated = { ...storeRef.current, ...changes };
    storeRef.current = updated;
    setStore(updated);
    writeQueueRef.current = writeQueueRef.current
      .catch(()=>{})
      .then(()=>sb.from("pcforge_data")
        .upsert({ user_id:user.id, ...updated, updated_at:new Date().toISOString() }, { onConflict:"user_id" })
        .then(({error})=>{ if(error) console.error("save failed", error); })
      );
  }

  const { parts, builds, sales, expenses } = store;

  function openModal(type,data={}){ setForm(data); setFormError(""); setModal({type}); }
  function closeModal(){ setModal(null); setForm({}); setFormError(""); }
  function setF(name,value){ setForm(prev=>({...prev,[name]:value})); }
  function askConfirm(key,action){
    if(confirmKey===key){ action(); setConfirmKey(null); } else { setConfirmKey(key); }
  }

  const stockValue = useMemo(()=>parts.reduce((s,p)=>s+p.qty*p.costPrice,0),[parts]);
  const revenue = useMemo(()=>sales.reduce((s,x)=>s+x.total,0),[sales]);
  const cogs = useMemo(()=>sales.reduce((s,x)=>s+x.cost,0),[sales]);
  const grossProfit = revenue - cogs;
  const totalExpenses = useMemo(()=>expenses.reduce((s,e)=>s+Number(e.amount),0),[expenses]);
  const netProfit = grossProfit - totalExpenses;
  const inStockParts = useMemo(()=>parts.filter(p=>p.qty>0),[parts]);
  const inStockQty = useMemo(()=>inStockParts.reduce((s,p)=>s+p.qty,0),[inStockParts]);
  const activeBuilds = builds.filter(b=>b.status==="in_progress");
  const soldBuilds = builds.filter(b=>b.status==="sold");

  const recentActivity = useMemo(()=>{
    const items = [
      ...sales.map(s=>({...s, kind:"sale", sortDate:s.date})),
      ...expenses.map(e=>({...e, kind:"expense", sortDate:e.date})),
    ];
    return items.sort((a,b)=>new Date(b.sortDate)-new Date(a.sortDate)).slice(0,8);
  },[sales,expenses]);

  function usedInBuilds(partId){
    const rows = [];
    builds.forEach(b=>{ b.parts.forEach(bp=>{ if(bp.partId===partId) rows.push({buildId:b.id,buildName:b.name,qty:bp.qty,status:b.status}); }); });
    return rows;
  }

  /* ---- Actions ---- */
  function submitPart(){
    const name=(form.name||"").trim();
    const category=form.category||CATEGORIES[0];
    const supplier=form.supplier||SUPPLIERS[0];
    const photo=form.photo||null;
    const qty=Number(form.qty??0);
    const costPrice=Number(form.costPrice??0);
    const sellPrice=Number(form.sellPrice??0);
    const lowStockThreshold=Number(form.lowStockThreshold??2);
    if(!name) return setFormError("Give this part a name.");
    if(qty<0||costPrice<0||sellPrice<0) return setFormError("Values can't be negative.");
    if(form.id){
      persist({ parts: parts.map(p=>p.id===form.id?{...p,name,category,supplier,photo,costPrice,sellPrice,lowStockThreshold,notes:form.notes||""}:p) });
    } else {
      persist({ parts: [...parts,{id:uid(),name,category,supplier,photo,qty,costPrice,sellPrice,lowStockThreshold,notes:form.notes||""}] });
    }
    closeModal();
  }

  function submitRestock(){
    const addQty=Number(form.addQty??0);
    const batchCost=Number(form.batchCost??0);
    if(addQty<=0) return setFormError("Enter a quantity greater than zero.");
    const part=parts.find(p=>p.id===form.id);
    const newQty=part.qty+addQty;
    const newCost=newQty>0?((part.qty*part.costPrice)+(addQty*batchCost))/newQty:batchCost;
    persist({ parts: parts.map(p=>p.id===part.id?{...p,qty:newQty,costPrice:newCost}:p) });
    closeModal();
  }

  function submitSellPart(){
    const part=parts.find(p=>p.id===form.id);
    const qty=Number(form.qty??0);
    const unitPrice=Number(form.unitPrice??0);
    if(qty<=0) return setFormError("Enter a quantity greater than zero.");
    if(qty>part.qty) return setFormError(`Only ${part.qty} in stock.`);
    const cost=part.costPrice*qty;
    const total=unitPrice*qty;
    const sale={id:uid(),date:form.date||todayStr(),type:"part",itemName:part.name,qty,unitCost:part.costPrice,unitPrice,cost,total,profit:total-cost,buyer:form.buyer||"",refId:part.id};
    persist({
      parts: parts.map(p=>p.id===part.id?{...p,qty:p.qty-qty}:p),
      sales: [...sales, sale],
    });
    closeModal();
  }

  function deletePart(id){ persist({ parts: parts.filter(p=>p.id!==id) }); }

  function submitNewBuild(){
    const name=(form.name||"").trim();
    if(!name) return setFormError("Give this build a name.");
    persist({ builds: [...builds, {id:uid(),name,dateCreated:form.dateCreated||todayStr(),status:"in_progress",parts:[],notes:form.notes||"",photo:form.photo||null,salePrice:null,buyer:"",dateSold:null}] });
    closeModal();
  }

  function submitAddBuildPart(){
    const build=builds.find(b=>b.id===form.buildId);
    const part=parts.find(p=>p.id===form.partId);
    const qty=Number(form.qty??0);
    if(!part) return setFormError("Choose a part.");
    if(qty<=0) return setFormError("Enter a quantity greater than zero.");
    if(qty>part.qty) return setFormError(`Only ${part.qty} in stock.`);
    persist({
      builds: builds.map(b=>b.id===build.id?{...b,parts:[...b.parts,{partId:part.id,name:part.name,qty,unitCost:part.costPrice}]}:b),
      parts: parts.map(p=>p.id===part.id?{...p,qty:p.qty-qty}:p),
    });
    closeModal();
  }

  function removeBuildPart(buildId,index){
    const build=builds.find(b=>b.id===buildId);
    const entry=build.parts[index];
    const part=parts.find(p=>p.id===entry.partId);
    persist({
      builds: builds.map(b=>b.id===buildId?{...b,parts:b.parts.filter((_,i)=>i!==index)}:b),
      ...(part ? { parts: parts.map(p=>p.id===part.id?{...p,qty:p.qty+entry.qty}:p) } : {}),
    });
  }

  function cancelBuild(buildId){
    const build=builds.find(b=>b.id===buildId);
    let updatedParts=parts;
    build.parts.forEach(entry=>{ updatedParts=updatedParts.map(p=>p.id===entry.partId?{...p,qty:p.qty+entry.qty}:p); });
    persist({
      parts: updatedParts,
      builds: builds.filter(b=>b.id!==buildId),
    });
  }

  function deleteSoldBuild(buildId){
    persist({
      builds: builds.filter(b=>b.id!==buildId),
      sales: sales.filter(s=>s.refId!==buildId),
    });
  }

  function submitSellBuild(){
    const build=builds.find(b=>b.id===form.id);
    const salePrice=Number(form.salePrice??0);
    if(salePrice<0) return setFormError("Sale price can't be negative.");
    const totalCost=build.parts.reduce((s,bp)=>s+bp.unitCost*bp.qty,0);
    const dateSold=form.dateSold||todayStr();
    const buyer=form.buyer||"";
    persist({
      builds: builds.map(b=>b.id===build.id?{...b,status:"sold",salePrice,buyer,dateSold}:b),
      sales: [...sales, {id:uid(),date:dateSold,type:"build",itemName:build.name,qty:1,unitCost:totalCost,unitPrice:salePrice,cost:totalCost,total:salePrice,profit:salePrice-totalCost,buyer,refId:build.id}],
    });
    closeModal();
  }

  function submitExpense(){
    const description=(form.description||"").trim();
    const amount=Number(form.amount??0);
    if(!description) return setFormError("Add a short description.");
    if(amount<=0) return setFormError("Amount must be greater than zero.");
    persist({ expenses: [...expenses, {id:uid(),date:form.date||todayStr(),category:form.category||EXPENSE_CATEGORIES[0],description,amount}] });
    closeModal();
  }

  function deleteExpense(id){ persist({ expenses: expenses.filter(e=>e.id!==id) }); }
  function deleteSale(id){ persist({ sales: sales.filter(s=>s.id!==id) }); }

  /* Edit an existing sale. Part sales can have qty/price/buyer/date changed
     (stock is adjusted by the difference in qty). Build sales can have
     price/buyer/date changed, and the linked build record is kept in sync. */
  function submitEditSale(){
    const sale = sales.find(s=>s.id===form.id);
    if(!sale) return closeModal();
    const newBuyer = form.buyer||"";
    const newDate = form.date||sale.date;

    if(sale.type==="part"){
      const newQty = Number(form.qty??sale.qty);
      const newUnitPrice = Number(form.unitPrice??sale.unitPrice);
      if(newQty<=0) return setFormError("Quantity must be greater than zero.");
      if(newUnitPrice<0) return setFormError("Price can't be negative.");
      const part = parts.find(p=>p.id===sale.refId);
      const qtyDelta = newQty - sale.qty; // >0 means selling more than before
      let updatedParts = parts;
      if(part){
        if(qtyDelta>0 && part.qty<qtyDelta) return setFormError(`Only ${part.qty} more in stock.`);
        updatedParts = parts.map(p=>p.id===part.id?{...p,qty:p.qty-qtyDelta}:p);
      }
      const cost = sale.unitCost*newQty;
      const total = newUnitPrice*newQty;
      const updatedSale = {...sale, qty:newQty, unitPrice:newUnitPrice, buyer:newBuyer, date:newDate, cost, total, profit: total-cost};
      persist({
        sales: sales.map(s=>s.id===sale.id?updatedSale:s),
        ...(part ? { parts: updatedParts } : {}),
      });
    } else {
      const newSalePrice = Number(form.salePrice??sale.unitPrice);
      if(newSalePrice<0) return setFormError("Sale price can't be negative.");
      const cost = sale.cost;
      const updatedSale = {...sale, unitPrice:newSalePrice, total:newSalePrice, profit:newSalePrice-cost, buyer:newBuyer, date:newDate};
      persist({
        sales: sales.map(s=>s.id===sale.id?updatedSale:s),
        builds: builds.map(b=>b.id===sale.refId?{...b,salePrice:newSalePrice,buyer:newBuyer,dateSold:newDate}:b),
      });
    }
    closeModal();
  }

  const filteredParts = parts.filter(p=>{
    const q=search.trim().toLowerCase();
    const matchesSearch = !q || p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q) || (p.supplier||"").toLowerCase().includes(q);
    const matchesCategory = categoryFilter==="all" ? true : p.category===categoryFilter;
    // Picking a specific category always shows in-stock items only (per request) —
    // the general stock filter still applies when viewing "All" categories.
    const matchesStock = categoryFilter!=="all" ? p.qty>0 : (stockFilter==="all" ? true : stockFilter==="in" ? p.qty>0 : p.qty===0);
    return matchesSearch && matchesCategory && matchesStock;
  });
  const categoryFilterQty = categoryFilter==="all" ? null : filteredParts.reduce((s,p)=>s+p.qty,0);

  if(loading){
    return <div className="pf-root"><div className="pf-shell" style={{alignItems:"center",justifyContent:"center",display:"flex"}}>
      <div style={{fontFamily:"JetBrains Mono, monospace",color:"var(--amber)",fontSize:12,letterSpacing:2}}>LOADING PCFORGE…</div>
    </div></div>;
  }

  return (
    <div className="pf-root">
      <div className="pf-shell">
        <div className="pf-header">
          <div className="pf-header-row">
            <div className="pf-logo">
              <Icon name="flame" size={22} color="var(--amber)"/>
              <div>
                <div className="pf-logo-text">PCFORGE</div>
                <div className="pf-logo-sub" onClick={()=>sb.auth.signOut()}>{user.email} · sign out</div>
              </div>
            </div>
            <div className="pf-header-net">
              <div className="pf-header-net-label">Net Profit</div>
              <div className="pf-header-net-value" style={{color: netProfit>=0 ? "var(--green)" : "var(--ember)"}}>{fmtR(netProfit)}</div>
            </div>
          </div>
        </div>

        <div className="pf-content">
          {tab==="dashboard" && (
            <Dashboard stockValue={stockValue} revenue={revenue} netProfit={netProfit} totalExpenses={totalExpenses}
              inStockQty={inStockQty} inStockCount={inStockParts.length}
              recentActivity={recentActivity} activeBuildsCount={activeBuilds.length}
              sales={sales} expenses={expenses} />
          )}
          {tab==="inventory" && (
            <InventoryTab parts={filteredParts} search={search} setSearch={setSearch}
              stockFilter={stockFilter} setStockFilter={setStockFilter}
              categoryFilter={categoryFilter} setCategoryFilter={setCategoryFilter} categoryFilterQty={categoryFilterQty}
              openModal={openModal} askConfirm={askConfirm} deletePart={deletePart}
              expandedPart={expandedPart} setExpandedPart={setExpandedPart} usedInBuilds={usedInBuilds} />
          )}
          {tab==="builds" && (
            <BuildsTab activeBuilds={activeBuilds} soldBuilds={soldBuilds} openModal={openModal} askConfirm={askConfirm}
              removeBuildPart={removeBuildPart} cancelBuild={cancelBuild} deleteSoldBuild={deleteSoldBuild} />
          )}
          {tab==="sales" && <SalesTab sales={sales} askConfirm={askConfirm} deleteSale={deleteSale} openModal={openModal} />}
          {tab==="expenses" && (
            <ExpensesTab expenses={expenses} totalExpenses={totalExpenses} openModal={openModal} askConfirm={askConfirm} deleteExpense={deleteExpense} />
          )}
        </div>

        <div className="pf-bottomnav">
          <NavBtn icon="dashboard" label="Dashboard" active={tab==="dashboard"} onClick={()=>setTab("dashboard")} />
          <NavBtn icon="package" label="Inventory" active={tab==="inventory"} onClick={()=>setTab("inventory")} />
          <NavBtn icon="wrench" label="Builds" active={tab==="builds"} onClick={()=>setTab("builds")} />
          <NavBtn icon="cart" label="Sales" active={tab==="sales"} onClick={()=>setTab("sales")} />
          <NavBtn icon="receipt" label="Expenses" active={tab==="expenses"} onClick={()=>setTab("expenses")} />
        </div>
      </div>

      {modal && (
        <ModalRenderer modal={modal} form={form} setF={setF} formError={formError} closeModal={closeModal}
          parts={parts} builds={builds} submitPart={submitPart} submitRestock={submitRestock} submitSellPart={submitSellPart}
          submitNewBuild={submitNewBuild} submitAddBuildPart={submitAddBuildPart} submitSellBuild={submitSellBuild}
          submitExpense={submitExpense} submitEditSale={submitEditSale} />
      )}
    </div>
  );
}

function NavBtn({icon,label,active,onClick}){
  return <button className={`pf-navbtn ${active?"active":""}`} onClick={onClick}>
    <Icon name={icon} size={18} color={active?"var(--amber)":"var(--text-faint)"}/>
    <span>{label}</span>
  </button>;
}

function MonthCompare({sales,expenses}){
  const thisMonth = useMemo(()=>getMonthBounds(0),[]);
  const lastMonth = useMemo(()=>getMonthBounds(-1),[]);
  const curr = useMemo(()=>sumInRange(sales,expenses,thisMonth.start,thisMonth.end),[sales,expenses,thisMonth]);
  const prev = useMemo(()=>sumInRange(sales,expenses,lastMonth.start,lastMonth.end),[sales,expenses,lastMonth]);
  const delta = curr.profit - prev.profit;
  const deltaPct = prev.profit !== 0 ? Math.round((delta/Math.abs(prev.profit))*100) : (curr.profit!==0 ? 100 : 0);
  const up = delta >= 0;

  return (
    <>
      <div className="pf-section-title"><Icon name="trend" size={13}/> This Month vs Last Month</div>
      <div className="pf-statgrid">
        <div className="pf-comparecard">
          <div className="pf-comparecard-label">{thisMonth.label}</div>
          <div className="pf-compare-row"><span>Revenue</span><b>{fmtR(curr.revenue)}</b></div>
          <div className="pf-compare-row"><span>Expenses</span><b>{fmtR(curr.expenses)}</b></div>
          <div className="pf-compare-row"><span>Profit</span><b style={{color:curr.profit>=0?"var(--green)":"var(--ember)"}}>{fmtR(curr.profit)}</b></div>
        </div>
        <div className="pf-comparecard">
          <div className="pf-comparecard-label">{lastMonth.label}</div>
          <div className="pf-compare-row"><span>Revenue</span><b>{fmtR(prev.revenue)}</b></div>
          <div className="pf-compare-row"><span>Expenses</span><b>{fmtR(prev.expenses)}</b></div>
          <div className="pf-compare-row"><span>Profit</span><b style={{color:prev.profit>=0?"var(--green)":"var(--ember)"}}>{fmtR(prev.profit)}</b></div>
        </div>
      </div>
      <div className="pf-comparecard pf-compare-delta" style={{color: up ? "var(--green)" : "var(--ember)"}}>
        {up ? "▲" : "▼"} {up?"+":""}{fmtR(delta)} vs last month {prev.profit!==0 ? `(${deltaPct>=0?"+":""}${deltaPct}%)` : ""}
      </div>
    </>
  );
}

function Dashboard({stockValue,revenue,netProfit,totalExpenses,inStockQty,inStockCount,recentActivity,activeBuildsCount,sales,expenses}){
  return (
    <>
      <div className="pf-section-title"><Icon name="dashboard" size={13}/> Readout</div>
      <div className="pf-statgrid">
        <StatCard label="Stock Value" value={fmtR(stockValue)} sub="cost basis" accent="blue" />
        <StatCard label="Revenue" value={fmtR(revenue)} sub="all-time" accent="amber" />
        <StatCard label="Net Profit" value={fmtR(netProfit)} sub="after expenses" accent={netProfit>=0?"green":"ember"} glow />
        <StatCard label="Expenses" value={fmtR(totalExpenses)} sub="all-time" accent="ember" />
      </div>

      <MonthCompare sales={sales} expenses={expenses} />

      <div className="pf-section-title"><Icon name="boxes" size={13}/> Stock On Hand</div>
      <StatCard label="In Stock Qty" value={inStockQty} sub={`${inStockCount} part${inStockCount===1?"":"s"} in stock`} accent="blue" />

      <div className="pf-section-title"><Icon name="wrench" size={13}/> Builds In Progress ({activeBuildsCount})</div>

      <div className="pf-section-title"><Icon name="trend" size={13}/> Recent Activity</div>
      <div className="pf-card">
        {recentActivity.length===0 ? (
          <div style={{color:"var(--text-faint)",fontSize:12}}>Nothing logged yet. Sales and expenses will show up here.</div>
        ) : recentActivity.map(item=>(
          <div className="pf-activity-row" key={item.kind+item.id}>
            <div className="pf-activity-icon" style={{background: item.kind==="sale"?"rgba(124,179,92,0.12)":"rgba(255,90,54,0.12)"}}>
              <Icon name={item.kind==="sale"?"arrowUp":"arrowDown"} size={14} color={item.kind==="sale"?"var(--green)":"var(--ember)"} />
            </div>
            <div className="pf-activity-text">
              {item.kind==="sale" ? <><b>Sold</b> {item.itemName} · {fmtDate(item.date)}</> : <><b>{item.category}</b> — {item.description} · {fmtDate(item.date)}</>}
            </div>
            <div className="pf-activity-amt" style={{color:item.kind==="sale"?"var(--green)":"var(--ember)"}}>
              {item.kind==="sale"?"+":"-"}{fmtR(item.kind==="sale"?item.total:item.amount)}
            </div>
          </div>
        ))}
      </div>
    </>
  );
}

function InventoryTab({parts,search,setSearch,stockFilter,setStockFilter,categoryFilter,setCategoryFilter,categoryFilterQty,openModal,askConfirm,deletePart,expandedPart,setExpandedPart,usedInBuilds}){
  return (
    <>
      <div className="pf-search"><Icon name="search" size={14} color="var(--text-faint)"/><input placeholder="Search parts…" value={search} onChange={e=>setSearch(e.target.value)} /></div>
      <div className="pf-filterrow">
        <select value={categoryFilter} onChange={e=>setCategoryFilter(e.target.value)}>
          <option value="all">All Categories</option>
          {CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}
        </select>
        <select value={stockFilter} onChange={e=>setStockFilter(e.target.value)} disabled={categoryFilter!=="all"}>
          <option value="all">All Items</option>
          <option value="in">In Stock Only</option>
          <option value="out">Out of Stock Only</option>
        </select>
      </div>
      {categoryFilter!=="all" && (
        <div style={{fontFamily:"JetBrains Mono, monospace",fontSize:11,color:"var(--text-dim)",marginTop:-6,marginBottom:14}}>
          {categoryFilterQty} {categoryFilter} unit{categoryFilterQty===1?"":"s"} in stock across {parts.length} listing{parts.length===1?"":"s"} · out-of-stock hidden
        </div>
      )}
      <button className="pf-btn pf-btn-primary pf-btn-block" onClick={()=>openModal("addPart")}><Icon name="plus" size={15}/> Add Part</button>

      <div style={{marginTop:16}}>
        {parts.length===0 ? (
          <EmptyState icon="package" title="Nothing here" message="No parts match this filter yet." />
        ) : (
          <div className="pf-card">
            {parts.map(p=>{
              const low = p.qty <= (p.lowStockThreshold ?? 2);
              const used = expandedPart===p.id ? usedInBuilds(p.id) : [];
              return (
                <div className="pf-listitem" key={p.id}>
                  <div className="pf-listitem-top">
                    <div className="pf-listitem-topleft">
                      <Thumb src={p.photo} />
                      <div>
                        <div className="pf-listitem-name">{p.name}</div>
                        <div className="pf-listitem-meta">{p.category} · cost {fmtR(p.costPrice)} · sell {fmtR(p.sellPrice)}</div>
                        {p.supplier && <div className="pf-listitem-meta">from {p.supplier}</div>}
                      </div>
                    </div>
                    <Badge tone={p.qty===0?"dim":low?"ember":hashAccent(p.category)}>{p.qty===0?"out of stock":`${p.qty} in stock`}</Badge>
                  </div>
                  <div className="pf-stockbar"><div className="pf-stockbar-fill" style={{width:`${Math.min(100,(p.qty/Math.max((p.lowStockThreshold||2)*3,6))*100)}%`, background: low?"var(--ember)":"var(--amber)"}} /></div>
                  <div className="pf-listitem-actions">
                    <button className="pf-btn pf-btn-sm" onClick={()=>openModal("restock",{id:p.id,batchCost:p.costPrice})}>Restock</button>
                    <button className="pf-btn pf-btn-sm" onClick={()=>openModal("sellPart",{id:p.id,qty:1,unitPrice:p.sellPrice,date:todayStr()})} disabled={p.qty===0}>Sell</button>
                    <button className="pf-iconbtn" onClick={()=>openModal("addPart",{...p})}><Icon name="pencil" size={13}/></button>
                    <button className="pf-iconbtn" onClick={()=>askConfirm("part-"+p.id, ()=>deletePart(p.id))}><Icon name="trash" size={13}/></button>
                    <div className="pf-expand" onClick={()=>setExpandedPart(expandedPart===p.id?null:p.id)}>
                      <Icon name={expandedPart===p.id?"chevronDown":"chevronRight"} size={12}/> used in builds
                    </div>
                  </div>
                  {expandedPart===p.id && (
                    <div className="pf-usedin">
                      {used.length===0 ? <div style={{fontSize:11,color:"var(--text-faint)",fontFamily:"JetBrains Mono, monospace"}}>Not used in any build yet.</div>
                      : used.map((u,i)=>(
                        <div className="pf-usedin-row" key={i}><span>{u.buildName} ×{u.qty}</span><Badge tone={u.status==="sold"?"green":"amber"}>{u.status==="sold"?"sold":"in progress"}</Badge></div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>
    </>
  );
}

function BuildsTab({activeBuilds,soldBuilds,openModal,askConfirm,removeBuildPart,cancelBuild,deleteSoldBuild}){
  const activeCost = activeBuilds.reduce((s,b)=>s+b.parts.reduce((s2,bp)=>s2+bp.unitCost*bp.qty,0),0);
  const soldProfit = soldBuilds.reduce((s,b)=>{
    const cost=b.parts.reduce((s2,bp)=>s2+bp.unitCost*bp.qty,0);
    return s+(b.salePrice-cost);
  },0);

  return (
    <>
      <button className="pf-btn pf-btn-primary pf-btn-block" onClick={()=>openModal("newBuild",{dateCreated:todayStr()})}><Icon name="plus" size={15}/> New Build</button>

      <div className="pf-statgrid" style={{marginTop:12}}>
        <StatCard label="Active Builds Cost" value={fmtR(activeCost)} sub={`${activeBuilds.length} in progress`} accent="blue" />
        <StatCard label="Builds Sold" value={soldBuilds.length} sub={fmtR(soldProfit)+" profit"} accent={soldProfit>=0?"green":"ember"} />
      </div>

      <div className="pf-section-title"><Icon name="wrench" size={13}/> In Progress ({activeBuilds.length})</div>
      {activeBuilds.length===0 ? (
        <EmptyState icon="wrench" title="No builds in progress" message="Start a build and pull parts straight from inventory." />
      ) : activeBuilds.map(b=>{
        const totalCost=b.parts.reduce((s,bp)=>s+bp.unitCost*bp.qty,0);
        return (
          <div className="pf-card" key={b.id}>
            <div className="pf-listitem-top">
              <div className="pf-listitem-topleft">
                <Thumb src={b.photo} />
                <div><div className="pf-listitem-name">{b.name}</div><div className="pf-listitem-meta">started {fmtDate(b.dateCreated)}</div></div>
              </div>
              <Badge tone="amber">In Progress</Badge>
            </div>
            <div className="pf-buildparts">
              {b.parts.length===0 ? <div style={{fontSize:11,color:"var(--text-faint)"}}>No parts added yet.</div>
              : b.parts.map((bp,i)=>(
                <div className="pf-buildpart-row" key={i}>
                  <span><b>{bp.name}</b> ×{bp.qty}</span>
                  <span style={{display:"flex",alignItems:"center",gap:8}}>{fmtR(bp.unitCost*bp.qty)}<span style={{cursor:"pointer"}} onClick={()=>removeBuildPart(b.id,i)}><Icon name="x" size={12} color="var(--text-faint)"/></span></span>
                </div>
              ))}
            </div>
            <div className="pf-totalbar"><span>Total cost</span><b>{fmtR(totalCost)}</b></div>
            <div className="pf-listitem-actions">
              <button className="pf-btn pf-btn-sm" onClick={()=>openModal("addBuildPart",{buildId:b.id,qty:1})}>+ Add Part</button>
              <button className="pf-btn pf-btn-sm pf-btn-primary" onClick={()=>openModal("sellBuild",{id:b.id,salePrice:"",dateSold:todayStr()})}>Mark Sold</button>
              <button className="pf-btn pf-btn-sm pf-btn-danger" onClick={()=>askConfirm("cancelbuild-"+b.id, ()=>cancelBuild(b.id))}>Cancel Build</button>
            </div>
          </div>
        );
      })}

      <div className="pf-section-title"><Icon name="check" size={13}/> Sold ({soldBuilds.length})</div>
      {soldBuilds.length===0 ? (
        <div className="pf-card" style={{color:"var(--text-faint)",fontSize:12}}>No builds sold yet.</div>
      ) : soldBuilds.map(b=>{
        const totalCost=b.parts.reduce((s,bp)=>s+bp.unitCost*bp.qty,0);
        const profit=b.salePrice-totalCost;
        return (
          <div className="pf-card" key={b.id}>
            <div className="pf-listitem-top">
              <div className="pf-listitem-topleft">
                <Thumb src={b.photo} />
                <div><div className="pf-listitem-name">{b.name}</div><div className="pf-listitem-meta">sold {fmtDate(b.dateSold)}{b.buyer?` · ${b.buyer}`:""}</div></div>
              </div>
              <Badge tone="green">Sold</Badge>
            </div>
            <div className="pf-buildparts">{b.parts.map((bp,i)=>(<div className="pf-buildpart-row" key={i}><span><b>{bp.name}</b> ×{bp.qty}</span><span>{fmtR(bp.unitCost*bp.qty)}</span></div>))}</div>
            <div className="pf-totalbar"><span>Cost</span><b>{fmtR(totalCost)}</b></div>
            <div className="pf-totalbar"><span>Sold for</span><b>{fmtR(b.salePrice)}</b></div>
            <div className="pf-totalbar"><span>Profit</span><b style={{color:profit>=0?"var(--green)":"var(--ember)"}}>{fmtR(profit)}</b></div>
            <div className="pf-listitem-actions">
              <button className="pf-btn pf-btn-sm pf-btn-danger" onClick={()=>askConfirm("delbuild-"+b.id, ()=>deleteSoldBuild(b.id))}>Delete Record</button>
            </div>
          </div>
        );
      })}
    </>
  );
}

      {sorted.length===0 ? (
        <EmptyState icon="cart" title="No sales yet" message="Sell a part from Inventory or mark a build as sold — it'll show up here." />

          <div className="pf-listitem" key={s.id}>

              <div style={{textAlign:"right"}}>

function PhotoField({label,value,onChange,enableScan,onScanResult}){
  const [busy,setBusy] = useState(false);
  const [scanning,setScanning] = useState(false);
  const [scanNote,setScanNote] = useState("");
  const cameraInputRef = useRef(null);
  const galleryInputRef = useRef(null);

  async function handleFile(e){
    const file = e.target.files[0];
    if(!file) return;
    setBusy(true);
    setScanNote("");
    try{
      const dataUrl = await resizeImageFile(file);
      onChange(dataUrl);
    }catch(err){
      console.error("photo resize failed", err);
    }
    setBusy(false);
    e.target.value = ""; // allow re-selecting the same file next time
  }
  async function handleScan(){
    if(!value) return;
    setScanning(true); setScanNote("");
    try{
      const { data, error } = await sb.functions.invoke("scan-part", { body: { image: value } });
      if(error) throw error;
      if(!data || !data.name){
        setScanNote("Couldn't identify the product from this photo — enter details manually.");
      } else {
        onScanResult(data);
        setScanNote(`Detected: ${data.name}${data.category?` (${data.category})`:""} — check it before saving.`);
      }
    }catch(err){
      console.error("scan failed", err);
      setScanNote("Scan failed — enter details manually.");
    }
    setScanning(false);
  }
  return (
    <Field label={label}>
      <input ref={cameraInputRef} type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={handleFile} />
      <input ref={galleryInputRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleFile} />
      <div style={{display:"flex",gap:8}}>
        <button type="button" className="pf-btn pf-btn-sm" style={{flex:1}} onClick={()=>cameraInputRef.current.click()}><Icon name="camera" size={13}/> Take Photo</button>
        <button type="button" className="pf-btn pf-btn-sm" style={{flex:1}} onClick={()=>galleryInputRef.current.click()}>Choose from Gallery</button>
      </div>
      {busy && <div style={{fontSize:11,color:"var(--text-faint)",marginTop:6}}>Processing photo…</div>}
      {value && !busy && <img className="pf-photo-preview" src={value} alt="preview" />}
      {enableScan && value && !busy && (
        <button type="button" className="pf-btn pf-btn-sm" style={{marginTop:8}} onClick={handleScan} disabled={scanning}>
          <Icon name="flame" size={12}/> {scanning?"Scanning…":"Scan with AI"}
        </button>
      )}
      {scanNote && <div style={{fontSize:11,color:"var(--text-dim)",marginTop:6,fontFamily:"JetBrains Mono, monospace"}}>{scanNote}</div>}
    </Field>
  );
}

function ModalRenderer({modal,form,setF,formError,closeModal,parts,builds,submitPart,submitRestock,submitSellPart,submitNewBuild,submitAddBuildPart,submitSellBuild,submitExpense,submitEditSale}){
  const {type}=modal;
  const titles={ addPart: form.id&&type==="addPart"?"Edit Part":"Add Part", restock:"Restock", sellPart:"Sell Part", newBuild:"New Build", addBuildPart:"Add Part To Build", sellBuild:"Mark Build Sold", addExpense:"Add Expense", editSale:"Edit Sale" };
  const part = form.id && (type==="restock"||type==="sellPart") ? parts.find(p=>p.id===form.id) : null;
  const build = form.id && type==="sellBuild" ? builds.find(b=>b.id===form.id) : null;
  const availableParts = parts.filter(p=>p.qty>0);

  function submit(){
    if(type==="addPart") submitPart();
    else if(type==="restock") submitRestock();
    else if(type==="sellPart") submitSellPart();
    else if(type==="newBuild") submitNewBuild();
    else if(type==="addBuildPart") submitAddBuildPart();
    else if(type==="sellBuild") submitSellBuild();
    else if(type==="addExpense") submitExpense();
    else if(type==="editSale") submitEditSale();
  }

  return (
    <div className="pf-overlay" onClick={e=>{ if(e.target===e.currentTarget) closeModal(); }}>
      <div className="pf-modal">
        <div className="pf-modal-header"><div className="pf-modal-title">{titles[type]}</div><button className="pf-iconbtn" onClick={closeModal}><Icon name="x" size={16}/></button></div>
        {formError && <div className="pf-error">{formError}</div>}

        {type==="addPart" && (<>
          <PhotoField label="Photo (optional)" value={form.photo} onChange={v=>setF("photo",v)}
            enableScan
            onScanResult={(data)=>{
              if(data.name) setF("name", data.name);
              if(data.category && CATEGORIES.includes(data.category)) setF("category", data.category);
            }} />
          <Field label="Name"><input value={form.name||""} onChange={e=>setF("name",e.target.value)} placeholder="e.g. Ryzen 5 5600" /></Field>
          <Field label="Category"><select value={form.category||CATEGORIES[0]} onChange={e=>setF("category",e.target.value)}>{CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}</select></Field>
          <Field label="Supplier"><select value={form.supplier||SUPPLIERS[0]} onChange={e=>setF("supplier",e.target.value)}>{SUPPLIERS.map(s=><option key={s} value={s}>{s}</option>)}</select></Field>
          {!form.id && <Field label="Starting Qty"><input type="number" min="0" value={form.qty??0} onChange={e=>setF("qty",e.target.value)} /></Field>}
          <div className="pf-field-row">
            <Field label="Cost Price (R)"><input type="number" min="0" step="0.01" value={form.costPrice??""} onChange={e=>setF("costPrice",e.target.value)} /></Field>
            <Field label="Sell Price (R)"><input type="number" min="0" step="0.01" value={form.sellPrice??""} onChange={e=>setF("sellPrice",e.target.value)} /></Field>
          </div>
          <Field label="Low Stock Alert Below"><input type="number" min="0" value={form.lowStockThreshold??2} onChange={e=>setF("lowStockThreshold",e.target.value)} /></Field>
          <Field label="Notes (optional)"><textarea rows={2} value={form.notes||""} onChange={e=>setF("notes",e.target.value)} /></Field>
        </>)}

        {type==="restock" && part && (<>
          <div style={{fontSize:13,color:"var(--text-dim)",marginBottom:10}}>{part.name} — currently {part.qty} in stock</div>
          <Field label="Quantity To Add"><input type="number" min="1" value={form.addQty??""} onChange={e=>setF("addQty",e.target.value)} /></Field>
          <Field label="Cost Per Unit This Batch (R)"><input type="number" min="0" step="0.01" value={form.batchCost??part.costPrice} onChange={e=>setF("batchCost",e.target.value)} /></Field>
        </>)}

        {type==="sellPart" && part && (<>
          <div style={{fontSize:13,color:"var(--text-dim)",marginBottom:10}}>{part.name} — {part.qty} in stock</div>
          <div className="pf-field-row">
            <Field label="Quantity"><input type="number" min="1" max={part.qty} value={form.qty??1} onChange={e=>setF("qty",e.target.value)} /></Field>
            <Field label="Sell Price / Unit (R)"><input type="number" min="0" step="0.01" value={form.unitPrice??part.sellPrice} onChange={e=>setF("unitPrice",e.target.value)} /></Field>
          </div>
          <Field label="Buyer (optional)"><input value={form.buyer||""} onChange={e=>setF("buyer",e.target.value)} /></Field>
          <Field label="Date"><input type="date" value={form.date||todayStr()} onChange={e=>setF("date",e.target.value)} /></Field>
        </>)}

        {type==="newBuild" && (<>
          <PhotoField label="Photo (optional)" value={form.photo} onChange={v=>setF("photo",v)} />
          <Field label="Build Name"><input value={form.name||""} onChange={e=>setF("name",e.target.value)} placeholder="e.g. Client Gaming Rig #4" /></Field>
          <Field label="Date Started"><input type="date" value={form.dateCreated||todayStr()} onChange={e=>setF("dateCreated",e.target.value)} /></Field>
          <Field label="Notes (optional)"><textarea rows={2} value={form.notes||""} onChange={e=>setF("notes",e.target.value)} /></Field>
        </>)}

        {type==="addBuildPart" && (<>
          <Field label="Part">
            <select value={form.partId||""} onChange={e=>setF("partId",e.target.value)}>
              <option value="">Select a part…</option>
              {availableParts.map(p=><option key={p.id} value={p.id}>{p.name} ({p.qty} in stock)</option>)}
            </select>
          </Field>
          <Field label="Quantity"><input type="number" min="1" value={form.qty??1} onChange={e=>setF("qty",e.target.value)} /></Field>
        </>)}

        {type==="sellBuild" && build && (<>
          <div style={{fontSize:13,color:"var(--text-dim)",marginBottom:10}}>{build.name} — total part cost {fmtR(build.parts.reduce((s,bp)=>s+bp.unitCost*bp.qty,0))}</div>
          <Field label="Sale Price (R)"><input type="number" min="0" step="0.01" value={form.salePrice??""} onChange={e=>setF("salePrice",e.target.value)} /></Field>
          <Field label="Buyer (optional)"><input value={form.buyer||""} onChange={e=>setF("buyer",e.target.value)} /></Field>
          <Field label="Date Sold"><input type="date" value={form.dateSold||todayStr()} onChange={e=>setF("dateSold",e.target.value)} /></Field>
        </>)}

        {type==="addExpense" && (<>
          <Field label="Description"><input value={form.description||""} onChange={e=>setF("description",e.target.value)} placeholder="e.g. Courier fee for parts order" /></Field>
          <Field label="Category"><select value={form.category||EXPENSE_CATEGORIES[0]} onChange={e=>setF("category",e.target.value)}>{EXPENSE_CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}</select></Field>
          <div className="pf-field-row">
            <Field label="Amount (R)"><input type="number" min="0" step="0.01" value={form.amount??""} onChange={e=>setF("amount",e.target.value)} /></Field>
            <Field label="Date"><input type="date" value={form.date||todayStr()} onChange={e=>setF("date",e.target.value)} /></Field>
          </div>
        </>)}

        {type==="editSale" && form.type==="part" && (<>
          <div style={{fontSize:13,color:"var(--text-dim)",marginBottom:10}}>{form.itemName}</div>
          <div className="pf-field-row">
            <Field label="Quantity"><input type="number" min="1" value={form.qty??1} onChange={e=>setF("qty",e.target.value)} /></Field>
            <Field label="Sell Price / Unit (R)"><input type="number" min="0" step="0.01" value={form.unitPrice??0} onChange={e=>setF("unitPrice",e.target.value)} /></Field>
          </div>
          <Field label="Buyer (optional)"><input value={form.buyer||""} onChange={e=>setF("buyer",e.target.value)} /></Field>
          <Field label="Date"><input type="date" value={form.date||todayStr()} onChange={e=>setF("date",e.target.value)} /></Field>
        </>)}

        {type==="editSale" && form.type==="build" && (<>
          <div style={{fontSize:13,color:"var(--text-dim)",marginBottom:10}}>{form.itemName} — part cost {fmtR(form.cost)}</div>
          <Field label="Sale Price (R)"><input type="number" min="0" step="0.01" value={form.unitPrice??0} onChange={e=>setF("unitPrice",e.target.value)} /></Field>
          <Field label="Buyer (optional)"><input value={form.buyer||""} onChange={e=>setF("buyer",e.target.value)} /></Field>
          <Field label="Date"><input type="date" value={form.date||todayStr()} onChange={e=>setF("date",e.target.value)} /></Field>
        </>)}

        <div className="pf-modal-actions">
          <button className="pf-btn pf-btn-ghost" style={{flex:1}} onClick={closeModal}>Cancel</button>
          <button className="pf-btn pf-btn-primary" style={{flex:1}} onClick={submit}>Save</button>
        </div>
      </div>
    </div>
  );
}

/* ===================== Root: auth gate ===================== */
function Root(){
  const [user,setUser] = useState(undefined);
  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>setUser(session?.user ?? null));
    const { data: listener } = sb.auth.onAuthStateChange((_event, session)=>{
      setUser(session?.user ?? null);
    });
    return ()=>listener.subscription.unsubscribe();
  },[]);

  if(user===undefined){
    return <div className="pf-root"><div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"JetBrains Mono, monospace",color:"var(--amber)",fontSize:12,letterSpacing:2}}>LOADING…</div></div>;
  }

  return user ? <PcForgeApp user={user} /> : <AuthScreen />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
